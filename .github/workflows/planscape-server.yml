name: Planscape Server — Build, Test & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Planscape.Server/**'
      - '.github/workflows/planscape-server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Planscape.Server/**'
      # Match the push trigger: a change to this workflow (service
      # containers, gate wiring) must be exercised on the PR that makes
      # it, not first observed after it lands on main.
      - '.github/workflows/planscape-server.yml'

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/planscape-api

jobs:
  # ── Build & Test ──────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Planscape.Server

    # A real PostgreSQL. The suite's other DbContexts are EF InMemory / SQLite,
    # and neither emits the SQL that broke /seq/reserve in production (PR #441:
    # FirstAsync composing over non-composable INSERT … RETURNING). Without a
    # server in CI that whole bug class stays invisible.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: planscape_test
          POSTGRES_USER: planscape
          POSTGRES_PASSWORD: planscape_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis mirrors production topology (refresh-token activity, JTI
      # blacklist, login-lockout counters, project-visibility cache).
      # Without it every Redis call in a test burned its full 5 s timeout
      # — ~900 of them, which is most of why the suite took 30 minutes.
      # The code fails soft when Redis is absent, so this is about speed
      # and about actually exercising the cache-hit paths, not about
      # making the suite pass.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Planscape.sln

      - name: Build
        run: dotnet build Planscape.sln --no-restore --configuration Release

      # ── Gate 1: the Postgres integration tests must be 100% green ──────────
      #
      # Small, new, and carrying no legacy debt, so "all must pass" is a
      # meaningful bar. They SKIP (not pass) when PLANSCAPE_TEST_PG is unset,
      # which is why it is set explicitly here — a silent skip in CI would be
      # the same false comfort this gate exists to remove.
      - name: Run Postgres integration tests
        env:
          PLANSCAPE_TEST_PG: "Host=localhost;Port=5432;Database=planscape_test;Username=planscape;Password=planscape_ci"
          Jwt__Key: "ci-only-3xJ9pQ7wR2mV5nB8kL4hT6yG1sD0aZfE"
        run: |
          dotnet test Planscape.sln --no-build --configuration Release             --filter "FullyQualifiedName~Postgres" --verbosity normal

      # ── Gate 2: no NEW failures in the rest of the suite ───────────────────
      #
      # WHY NOT "zero failures": the suite carries 66 uniquely-named
      # pre-existing failures (73 cases). Gating on zero makes CI permanently
      # red and therefore ignored — which is exactly how this step ended up with
      # `continue-on-error: true` and a comment claiming "No tests yet" while
      # 400+ tests existed. Gating on "nothing NEW broke" is enforceable today.
      #
      # Fixing a baseline entry: delete its line from
      # Planscape.Server/tests/known-failing-tests.txt in the same PR, and the
      # check then guards the fix.
      - name: Run full test suite
        id: fullsuite
        env:
          PLANSCAPE_TEST_PG: "Host=localhost;Port=5432;Database=planscape_test;Username=planscape;Password=planscape_ci"
          Jwt__Key: "ci-only-3xJ9pQ7wR2mV5nB8kL4hT6yG1sD0aZfE"
        run: |
          set +e
          dotnet test Planscape.sln --no-build --configuration Release             --verbosity normal 2>&1 | tee /tmp/test-output.txt
          exit 0            # the diff below decides pass/fail, not the exit code

      - name: Fail only on NEW test failures
        run: bash tests/check-new-failures.sh /tmp/test-output.txt

      - name: Generate OpenAPI spec
        working-directory: Planscape.Server
        run: |
          # Install swagger CLI tool
          dotnet tool restore 2>/dev/null || dotnet tool install --global Swashbuckle.AspNetCore.Cli --version 6.9.0 2>/dev/null || true
          # Try to export openapi.json — non-fatal if swagger tool unavailable
          dotnet swagger tofile \
            --output src/Planscape.API/openapi.json \
            src/Planscape.API/bin/Release/net8.0/Planscape.API.dll v1 2>/dev/null || \
          echo "::notice::OpenAPI export skipped (swagger CLI unavailable — install Swashbuckle.AspNetCore.Cli)"
        continue-on-error: true

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('Planscape.Server/src/Planscape.API/openapi.json') != ''
        with:
          name: openapi-spec-${{ github.sha }}
          path: Planscape.Server/src/Planscape.API/openapi.json
          retention-days: 90

      - name: Check for migration drift
        working-directory: Planscape.Server
        run: |
          # Verify EF model matches migrations (catches forgotten migrations)
          dotnet ef migrations list \
            --project src/Planscape.Infrastructure/Planscape.Infrastructure.csproj \
            --startup-project src/Planscape.API/Planscape.API.csproj \
            --no-connect 2>/dev/null | tail -5 || \
          echo "::notice::EF migration list skipped (no DB connection in CI — expected)"
        continue-on-error: true
        env:
          # Dummy connection so EF tooling doesn't crash; --no-connect should suffice
          ConnectionStrings__Default: "Host=localhost;Database=ci_check;Username=ci;Password=ci"

  # ── Docker Build & Push ───────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx with the docker-container driver is REQUIRED for GHA cache export
      # (cache-to: type=gha). Without it the default 'docker' driver is used and
      # the build fails: "Cache export is not supported for the docker driver."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Context = repo root: the Dockerfile COPYs repo-root paths
          # (Planscape/assets/viewer/, Planscape.Server/src/**, COPY . .) and is
          # documented "Build context is the STINGTOOLS repo root" (matches
          # docker-compose's context: ../..). 'Planscape.Server' was wrong and
          # made every COPY fail "not found".
          context: .
          file: Planscape.Server/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Render.com ──────────────────────────────────────────────────────
  #
  # DO NOT DELETE THIS JOB TO STOP DUPLICATE DEPLOYS. It is the *filtered* one.
  #
  # Two triggers exist for the same service (#717): this job, which honours the
  # `paths:` filter above and so only fires for Planscape.Server changes, and the
  # Render dashboard's own Auto-Deploy, which fires on EVERY push to main —
  # including docs- and marketing-site-only commits. That second trigger is what
  # rebuilds the API when a Revit plugin file changes, and where the
  # "deploy failed" emails come from.
  #
  # Removing this job would leave the UNFILTERED trigger as the only one: still
  # rebuilding on everything, and now with no gated path at all. The correct
  # order is to turn Auto-Deploy OFF in the Render dashboard first, after which
  # this becomes the single, path-filtered trigger.
  #
  # Note render.yaml's `autoDeploy: true` is NOT that setting — the blueprint does
  # not govern the live services (see the header of render.yaml).
  deploy:
    name: Deploy to Render.com
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.planscape.build

    steps:
      # This job reported SUCCESS for months while deploying nothing.
      #
      # RENDER_API_KEY and RENDER_SERVICE_ID were never set on the repository, so the
      # request went to `/v1/services//deploys` with an empty bearer token — and `curl -s`
      # with no `-f` exits 0 on any HTTP status, so the step went green. Measured
      # 2026-08-22: #764 merged, this job reported "Deploy to Render.com - success", and
      # production still served the previous build an hour later.
      #
      # A deploy step that cannot work and cannot fail is worse than none: it turns
      # "did my change ship?" into a question the green tick answers wrongly.
      - name: Check the deploy credentials exist
        env:
          KEY: ${{ secrets.RENDER_API_KEY }}
          SVC: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          missing=""
          [ -z "$KEY" ] && missing="$missing RENDER_API_KEY"
          [ -z "$SVC" ] && missing="$missing RENDER_SERVICE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Cannot deploy - missing secret(s):$missing. Add them in GitHub > Settings > Secrets and variables > Actions. RENDER_SERVICE_ID must be the service that actually SERVES (planscape-api-free); render.yaml names planscape-api, which 404s."
            exit 1
          fi

      - name: Trigger Render.com deploy
        env:
          KEY: ${{ secrets.RENDER_API_KEY }}
          SVC: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          # Capture the status and fail on non-2xx. Without this, an auth error or a
          # wrong service id is indistinguishable from a deploy.
          code=$(curl -s -o render.json -w '%{http_code}'             -X POST "https://api.render.com/v1/services/$SVC/deploys"             -H "Authorization: Bearer $KEY"             -H "Content-Type: application/json"             -d '{"clearCache": false}')
          echo "Render responded HTTP $code"
          cat render.json || true
          case "$code" in
            2*) echo "Deploy queued." ;;
            *)  echo "::error::Render refused the deploy request (HTTP $code). Failing rather than reporting a deploy that did not happen."; exit 1 ;;
          esac
