name: Plugin Release

# Build the StingTools plugin on Windows against the real Revit reference
# assemblies and publish a GitHub Release with StingTools.dll (and the full
# CompiledPlugin zip) attached — a one-click download for deploying into Revit's
# add-in folder.
#
# Trigger it either way:
#   • Actions tab → "Plugin Release" → Run workflow (workflow_dispatch), or
#   • push a tag matching plugin-*  (e.g. `git tag plugin-v1.2 && git push origin plugin-v1.2`), or
#   • merge (or push) to main with "[release]" in the head commit message. Agent sessions
#     cannot push tags or dispatch workflows through their git proxy, so this is how they
#     publish a build: merge the PR with "[release]" in the merge commit message.

on:
  workflow_dispatch:
  push:
    tags:
      - 'plugin-*'
    branches:
      - main

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    name: Build & publish plugin release
    # A push to main publishes only when its head commit asks for it.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore Planscape.Server/src/Planscape.Shared/Planscape.Shared.csproj
          dotnet restore Planscape.Server/src/Planscape.PluginSync/Planscape.PluginSync.csproj
          dotnet restore StingTools.Standards/StingTools.Standards.csproj
          dotnet restore StingTools/StingTools.csproj

      - name: Build plugin (Release)
        shell: pwsh
        run: dotnet build StingTools/StingTools.csproj --configuration Release --no-restore --nologo -v minimal

      - name: Package CompiledPlugin
        shell: pwsh
        run: |
          $buildOut  = "StingTools\bin\Release"
          $deployDir = "CompiledPlugin"
          $dataDir   = "$deployDir\data"
          New-Item -ItemType Directory -Force -Path $deployDir | Out-Null
          New-Item -ItemType Directory -Force -Path $dataDir   | Out-Null
          Copy-Item "$buildOut\StingTools.dll" $deployDir -Force
          Get-ChildItem "$buildOut\*.dll" |
            Where-Object { $_.Name -notin @('RevitAPI.dll','RevitAPIUI.dll') } |
            Copy-Item -Destination $deployDir -Force
          if (Test-Path "$buildOut\data") {
            Copy-Item "$buildOut\data\*" $dataDir -Recurse -Force
          } elseif (Test-Path "StingTools\Data") {
            Copy-Item "StingTools\Data\*" $dataDir -Recurse -Force
          }
          Copy-Item "StingTools.addin" $deployDir -Force
          Compress-Archive -Path "$deployDir\*" -DestinationPath "StingTools-CompiledPlugin.zip" -Force

      # The tester kit: the same CompiledPlugin plus a per-user installer, the licence
      # helpers, the tester guide and the Revit smoke tests. Testers run
      # Get-MachineCode.cmd, Install-STING.cmd and Install-Licence.cmd; licences are
      # issued separately with tools/tester-kit/licence-issuer (never shipped).
      - name: Package tester kit
        shell: pwsh
        run: |
          $stamp = Get-Date -Format 'yyyy-MM-dd'
          $kit   = "STING-Tester-Kit-$stamp"
          New-Item -ItemType Directory -Force -Path "$kit\SmokeTests" | Out-Null
          Copy-Item "CompiledPlugin" "$kit\Plugin" -Recurse -Force
          Remove-Item "$kit\Plugin\StingTools.addin" -Force   # the installer writes its own
          Copy-Item "StingTools\bin\Release\StingTools.pdb" "$kit\Plugin" -Force
          if (Test-Path "Families\TitleBlocks\_seeds") {
            New-Item -ItemType Directory -Force -Path "$kit\Plugin\Families\TitleBlocks\_seeds" | Out-Null
            Get-ChildItem "Families\TitleBlocks\_seeds\*.rfa" |
              Where-Object { $_.Name -notmatch '\.\d{4}\.rfa$' } |
              Copy-Item -Destination "$kit\Plugin\Families\TitleBlocks\_seeds" -Force
          }
          Get-ChildItem "tools\tester-kit" -File | Copy-Item -Destination $kit -Force
          Copy-Item "docs\TAG_TEST_PROTOCOL.md" "$kit\SmokeTests" -Force
          Copy-Item "docs\examples\SYMBOL_SLD\REVIT_SMOKE_TEST.md" "$kit\SmokeTests\SYMBOL_SLD_REVIT_SMOKE_TEST.md" -Force
          Copy-Item "docs\examples\SYMBOL_SLD\SYMBOL_SLD_Revit_Smoke_Test_Checklist.docx" "$kit\SmokeTests" -Force
          @(
            "STING Tools - tester build"
            "Built:    $stamp from ${{ github.sha }} (${{ github.ref_name }})"
            "Licence:  machine-bound, 90 days from issue (see TESTER_GUIDE)"
            "Status:   passed build, unit tests and CI gates; see CHANGELOG for what has been exercised in Revit"
          ) | Set-Content "$kit\VERSION.txt"
          Compress-Archive -Path $kit -DestinationPath "STING-Tester-Kit.zip" -Force

      - name: Publish release with the plugin DLL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "plugin-build-${{ github.run_number }}" }
          gh release create "$tag" `
            --target "${{ github.sha }}" `
            "CompiledPlugin/StingTools.dll" `
            "StingTools-CompiledPlugin.zip" `
            "STING-Tester-Kit.zip" `
            --title "STING Tools plugin — $tag" `
            --notes @"
          Prebuilt STING Tools plugin, built on Windows against the real Revit 2025 reference assemblies.

          Deploy (with Revit closed):
          1. Download **StingTools.dll** below.
          2. Open ``%AppData%\Autodesk\Revit\Addins\2025\StingTools.addin`` and read the ``<Assembly>...\StingTools.dll</Assembly>`` path — that folder is your current install.
          3. Copy the downloaded StingTools.dll into that folder, overwriting the old one.
          4. Start Revit.

          For a clean install use **StingTools-CompiledPlugin.zip** (DLL + dependencies + data).

          For testers use **STING-Tester-Kit.zip**: per-user installer, tester guide and Revit smoke tests. Each tester needs a 90-day licence issued with tools/tester-kit/licence-issuer.
          "@
