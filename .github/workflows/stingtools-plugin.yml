name: StingTools Plugin — Build, Validate & Release

on:
  push:
    branches: [main]
    paths:
      - 'StingTools/**'
      - 'StingTools.Standards/**'
      - 'Planscape.Server/src/Planscape.Shared/**'
      - 'Planscape.Server/src/Planscape.PluginSync/**'
      - 'tools/**'
      - 'project-templates/**'
      - 'GUIDES/kibale-project-config/**'
      - '.github/workflows/stingtools-plugin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'StingTools/**'
      - 'StingTools.Standards/**'
      - 'tools/**'
      - 'project-templates/**'
      - 'GUIDES/kibale-project-config/**'
      - '.github/workflows/stingtools-plugin.yml'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # ── 1. Data file validation (Linux, fast) ────────────────────────────────────
  validate-data:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON data files
        run: |
          FAIL=0
          for f in StingTools/Data/**/*.json StingTools/Data/*.json; do
            [ -f "$f" ] || continue
            if ! python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
              echo "❌ Invalid JSON: $f"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "✓ All JSON files valid"
          exit $FAIL

      # Data schemas (DSCH): every file under StingTools/Data, project-templates,
      # GUIDES/kibale-project-config and tools must be registered in
      # tools/data_schemas.json, and is checked against what is declared there —
      # CSV headers and per-row field counts, JSON unknown keys (derived from the
      # POCO) and duplicate keys, encoding and line endings. The validator existed
      # since H-5 and ran in NO workflow, so when D6 inserted PROD into
      # cost_rates_5d.csv it failed on main for weeks and nobody saw it, while the
      # 5D Cost Trace — still indexing by position — silently lost every rate.
      # The self-test runs first: it mutates real files and fails if any defect
      # goes uncaught, so a broken checker cannot report green.
      - name: Data-schema validator catches what it claims to
        run: python3 tools/validate_data_schemas.py --self-test

      - name: Data files match their schemas
        run: python3 tools/validate_data_schemas.py

      # DSCH round 2: eleven check scripts under tools/ ran in NO workflow, so each
      # could regress unseen — the state validate_data_schemas.py was in. Each is a
      # ratchet or a zero-tolerance check that passes on main today. Not gated, with
      # the reason, in docs/WORKLOG_DATA_SCHEMAS.md (DSCH-6/7/12 later fixed and
      # gated below).
      # DSCH-6: a parameter both a formula and C# write is two owners racing; the
      # formula back-filled what the engine had deliberately cleared. Ratchet.
      - name: No new parameter with two owners
        run: python3 tools/validate_dual_owner.py

      # DSCH-7: the QS NRM2 review round trip (export -> verdict -> apply) works.
      - name: QS NRM2 review round trip
        run: python3 tools/check_qs_nrm2_review.py

      # DSCH-12: a public static map/predicate in Core that nothing calls is a
      # mechanism that cannot fire. One tokenised pass (2 s, was 8 min); ratchet.
      - name: No new declared-but-uncalled map or predicate
        run: python3 tools/validate_declared_but_uncalled.py

      # DSCH-40: the wide scope - tuple return types, members outside Core/,
      # Load* / Build* names - under its own ratchet, so the Core baseline stays 0.
      - name: No new declared-but-uncalled member (wide scope)
        run: python3 tools/validate_declared_but_uncalled.py --wide

      # DSCH-27: test-oracle markers are verified, not trusted; prove the check fires.
      - name: Declared-but-uncalled marker check can fail
        run: python3 tools/validate_declared_but_uncalled.py --self-test

      - name: Binding scope has not grown
        run: python3 tools/check_binding_scope.py --check

      - name: Shared-parameter kit files agree on GUID and type
        run: python3 tools/check_shared_param_types.py

      - name: Tag vocabulary has no sentinel that doubles as a code
        run: python3 tools/check_tag_vocabulary.py --check

      - name: Every title-block CSV row is defined, bound and offered
        run: python3 tools/check_title_block_surfaces.py

      - name: KUT coordination cycle has no unbaselined interactive step
        run: python3 tools/check_unattended_cycle.py

      - name: Parameter readership matcher works
        run: python3 tools/validate_param_readership.py --self-test

      - name: Parameter readership has not regressed
        run: python3 tools/validate_param_readership.py

      - name: Gap-register header count is current
        run: python3 tools/register_count.py --check

      - name: No new declared-but-unbound shared parameter
        run: python3 tools/binding_simulator.py --check

      - name: Content-manifest checksums match the shipped tag families
        run: python3 tools/restamp_content_manifest.py --check StingTools/Data/TagFamilies

      - name: Commands resolve the application through a resolver
        shell: pwsh
        run: ./tools/check_command_app_acquisition.ps1

      - name: No new dispatch drift
        shell: pwsh
        run: ./tools/check_dispatch_parity.ps1

      # Drawing-type corporate lock: every corporate entry in
      # STING_DRAWING_TYPES.json carries a SHA-256 of its C# serialisation, and
      # DrawingTypeRegistry demotes any entry whose hash does not match to
      # origin "project" — so a data edit (or a field added to DrawingType /
      # AnnotationRulePack) without a restamp silently turns the lock off for
      # that type. The tool compiles the shipped model to hash it; --check
      # verifies without writing and exits 1 on a missing or stale checksum.
      # It was documented as "CI-gate ready" and wired into no workflow.
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Drawing-type checksums are current
        run: dotnet run --project tools/StampDrawingTypeChecksums -c Release -- --check

      # Path discipline: project paths must resolve through StingPaths /
      # ProjectFolderEngine / CoordStores, not be assembled by hand.
      #
      # The gate existed but was wired into NO workflow, so it had never run in
      # CI — which is part of how its baseline came to claim ZERO while ~9 legacy
      # sibling sites and 139 hand-rolled _BIM_COORD sites were live in the tree.
      - name: Check path discipline
        shell: pwsh
        run: ./tools/check_path_discipline.ps1

      # Workflow wiring: every WORKFLOW_*.json step must name a command the engine
      # can resolve, and must not carry keys the engine never reads. Silent no-ops
      # that used to get through here: steps keyed "tag" instead of "commandTag"
      # (11 presets, every step, so each ran ZERO steps and still reported success),
      # commandTags with no ResolveCommand case, "order" disagreeing with the array
      # order the engine actually executes (Tier 3), and any other step key that
      # WorkflowStep does not bind, which Newtonsoft drops without a word (Tier 5).
      - name: Check workflow wiring
        shell: pwsh
        run: ./tools/check_workflow_wiring.ps1

      # Unreachable commands: docs/UNREACHABLE_COMMANDS_TRIAGE.md carried a count
      # measured against ONE of six dispatch layers, and a count in that file drives
      # deletions -- an over-report there is an invitation to delete live code. The
      # number is now derived; this fails when the doc drifts from the tree.
      - name: Unreachable-commands count is current
        run: python3 tools/recount_unreachable_commands.py --check

      # Parameter contract: a bound shared parameter that is written and never read,
      # or read and never written, is a producer and a consumer that were never
      # introduced. That defect has been found by hand, on a delivered model, months
      # late, six times this quarter — MAT_CODE, MAT_COST_UGX/USD, the 24 BLE_APP-*
      # appearance columns, RateProviders' unreachable "Pass C".
      #
      # The gate is DECLARATION-driven, not derived: three successive scans tried to
      # count the orphans and all three were wrong, because ParamRegistry.WriteContainers
      # resolves its targets from an array of values and no parameter name appears at
      # the call site. So this fails when the SET changes without anyone recording why,
      # never on a count.
      - name: Parameter contract is current
        run: python3 tools/check_param_contract.py --check

      # Every command tag the natural-language processor can hand to the dispatcher
      # must resolve. 97 did not (2026-09-24) — each ended in "Unknown Command" — while
      # the startup check that was meant to catch them asked one dispatch layer and
      # vouched for the rest with an allowlist that included two dead tags. This reads
      # all four layers NLP actually reaches.
      - name: No NLP intent dispatches to nothing
        run: python3 tools/check_nlp_dispatch.py --check

      # Revit gives a shared-parameter GUID one type. Ten parameters once had a
      # different type in STING_PARAMS_V4/V6 than in MR_PARAMETERS.txt, so a family
      # authored from one file would not load into a project bound from the other.
      - name: Shared-parameter files agree
        run: python3 tools/check_shared_param_files.py

      # STING_TAG_TOKEN_POLICY.json shipped on 2026-08-10 documenting all ten ISO 19650
      # tag tokens, was named in two TagConfig comments, and was read by NOTHING until
      # 2026-09-15 — the fallbacks were hardcoded literals, so editing it changed no
      # behaviour and nothing said so. A unit test cannot catch that: it can prove
      # TagTokenPolicy.Resolve is correct while no caller invokes it. This asserts the
      # call sites exist and that the literals have not come back.
      - name: Tag token policy still governs tagging
        run: python3 tools/check_token_policy_wired.py --check

      # A tag row whose parameter is not bound to that category renders EMPTY. It does
      # not throw and nothing logs it — the STING room tag showed a blank where the room
      # name belongs for as long as it existed, and 1,019 more rows are in the same state.
      # A ratchet, not a zero: it fails when the count RISES.
      - name: No new tag rows that can never display
        run: python3 tools/check_tag_row_bindings.py --check

      # A stamp bound where it is never written is a no-op nobody sees. Sixteen view
      # stamps sat at <ALL> (element categories, no Views), so drawing production
      # could not find its own views and duplicated them on every run; the match-line
      # stamps missed OST_Lines the same way; 49 AEC filters named a rule parameter
      # not bound to the filter's categories, so Revit refused to create them
      # (DTW-55..59). Checks tools/drawing_binding_contract.json against the spec, a
      # grep of every STING parameter used on a view receiver, and every filter rule.
      - name: Drawing-layer parameters are bound where they are written
        run: python3 tools/check_drawing_bindings.py

      # Every NativeParamMapper helper used to end at SetString, which returns false the
      # moment the target is not String storage. 28 of 57 map targets are declared
      # LENGTH/AREA/NUMBER/CURRENCY, so those writes did nothing and logged nothing — a
      # door tag with no width, a room tag with no area. A unit test cannot reach this
      # (it needs a live Revit Parameter and the failure is a silent false return), so
      # the call site is the instrument.
      - name: Map helpers still respect the target parameter type
        run: python3 tools/check_map_target_types.py --check

      # The same parameter twice on one tag prints the same value twice on the drawing.
      # 291 rows repeated a tier-2 parameter in tier 3, and 8 of the 12 presentation modes
      # show those tiers together. Reads presentation_modes rather than assuming which
      # tiers co-display, so a new mode extends the check automatically.
      - name: No tag prints the same value twice
        run: python3 tools/check_tag_row_duplicates.py --check

      # A method that catches an exception, abandons the work and then tells its
      # caller it succeeded. Four of those built a project's whole finish catalogue
      # out of one default layer and reported '168/168 renamed, 0 failed'. This is
      # a ratchet, not a zero: it fails when the count RISES.
      - name: No new catch that lies about the outcome
        run: python3 tools/find_lying_catches.py --check

      - name: Command doc-acquisition discipline
        shell: pwsh
        run: ./tools/check_command_doc_acquisition.ps1

      - name: Export routing discipline
        shell: pwsh
        run: ./tools/check_export_routing.ps1

      - name: C# language version pinned to the CI SDK
        shell: pwsh
        run: |
          # CI builds with the .NET 8 SDK (C# 12). "latest" means C# 14 on a
          # .NET 10 machine, so code that compiled locally broke here (DOCX-10).
          $bad = Get-ChildItem -Recurse -Filter *.csproj |
            Where-Object { (Get-Content $_.FullName -Raw) -match '<LangVersion>(?!12\.0<)[^<]*</LangVersion>' }
          if ($bad) { $bad | ForEach-Object { Write-Host "LangVersion not 12.0: $($_.FullName)" }; exit 1 }
          Write-Host "All projects pin LangVersion 12.0."

      - name: Check for duplicate parameter GUIDs
        run: |
          python3 - <<'EOF'
          import re, sys, collections

          # MR_PARAMETERS.csv is, BY DESIGN, a 1:1 mirror of MR_PARAMETERS.txt
          # (same parameter set, same GUIDs). A real duplicate is the SAME GUID
          # appearing twice WITHIN one file. The previous check pooled GUIDs from
          # both files into one dict, so every GUID looked "duplicated" (once in
          # the .txt, once in its .csv mirror) — a false positive that failed on
          # all 3286 params. Scope the duplicate check PER FILE; additionally
          # verify the two files mirror each other (same GUID set).
          guid_re = re.compile(r'\b([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\b')

          paths = ['StingTools/Data/MR_PARAMETERS.txt', 'StingTools/Data/MR_PARAMETERS.csv']
          FAIL = 0
          per_file_sets = {}
          for path in paths:
              seen = collections.defaultdict(list)
              try:
                  for i, line in enumerate(open(path), 1):
                      for guid in guid_re.findall(line):
                          seen[guid.lower()].append(i)
              except FileNotFoundError:
                  continue
              per_file_sets[path] = set(seen)
              dupes = {g: lines for g, lines in seen.items() if len(lines) > 1}
              if dupes:
                  for guid, lines in dupes.items():
                      print(f'❌ Duplicate GUID {guid} within {path}: lines {lines}')
                  FAIL = 1
              else:
                  print(f'✓ {path}: no within-file duplicate GUIDs ({len(seen)} unique)')

          # Mirror-integrity check: the .csv must carry the same GUID set as the .txt.
          if len(per_file_sets) == 2:
              a, b = per_file_sets[paths[0]], per_file_sets[paths[1]]
              only_txt, only_csv = a - b, b - a
              if only_txt or only_csv:
                  if only_txt:
                      print(f'❌ {len(only_txt)} GUID(s) in .txt missing from the .csv mirror: '
                            f'{sorted(only_txt)[:5]}')
                  if only_csv:
                      print(f'❌ {len(only_csv)} GUID(s) in .csv missing from the .txt source: '
                            f'{sorted(only_csv)[:5]}')
                  FAIL = 1
              else:
                  print(f'✓ .txt/.csv mirror in sync ({len(a)} GUIDs)')

          # Group-declaration check. A PARAM row names its group by ID; Revit's
          # shared-parameter format requires that ID to appear in the *GROUP block, and
          # a parameter in an undeclared group does not load. Nothing above would catch
          # it: the GUID is unique, the mirror is in sync, the file parses. It surfaces
          # only in Revit, as a parameter that is simply absent.
          declared, used = set(), {}
          try:
              for line in open('StingTools/Data/MR_PARAMETERS.txt', encoding='utf-8-sig'):
                  f = line.rstrip('\n').rstrip('\r').split('\t')
                  if f[0] == 'GROUP' and len(f) >= 2:
                      declared.add(f[1])
                  elif f[0] == 'PARAM' and len(f) >= 6:
                      used.setdefault(f[5], []).append(f[2])
          except FileNotFoundError:
              pass
          orphans = {g: n for g, n in used.items() if g not in declared}
          if orphans:
              for g, names in sorted(orphans.items()):
                  print(f'❌ GROUP {g} is used by {len(names)} parameter(s) but never declared: '
                        f'{names[:5]}')
              FAIL = 1
          elif used:
              print(f'✓ every PARAM group is declared ({len(declared)} groups, '
                    f'{sum(len(n) for n in used.values())} params)')
          sys.exit(FAIL)
          EOF

      - name: Check parameter CSV row integrity (column count)
        run: |
          python3 - <<'EOF'
          import csv, sys, collections

          # WHY THIS EXISTS.
          # The duplicate-GUID check above is structurally blind to field-shift
          # corruption: it regex-scans for GUIDs anywhere on a line, so a row whose
          # columns are all shifted one place still presents a valid, unique GUID
          # and passes clean.
          #
          # The corruption it misses: an UNQUOTED comma inside Description splits
          # that field in two and shifts every later column by one, so Discipline,
          # User_Modifiable and Hide_When_No_Value silently read their neighbour's
          # value. Seven rows carried this. It went unnoticed for so long because
          # the only visible symptom — a 14-field row against the file's 13 — was
          # itself removed by trimming the trailing column, which normalised the
          # count and destroyed the evidence while leaving the data wrong.
          #
          # A per-row column count against the header catches the whole class, and
          # is the check that would have caught it at the time.
          PARAM_CSVS = ['StingTools/Data/MR_PARAMETERS.csv']
          FAIL = 0
          for path in PARAM_CSVS:
              try:
                  rows = [r for r in csv.reader(open(path, encoding='utf-8'))
                          if r and not r[0].lstrip().startswith('#')]
              except FileNotFoundError:
                  print(f'- {path}: not found, skipped')
                  continue
              if not rows:
                  print(f'- {path}: empty, skipped')
                  continue
              header, data = rows[0], rows[1:]
              want = len(header)
              bad = collections.defaultdict(list)
              for i, r in enumerate(data, start=2):
                  if len(r) != want:
                      bad[len(r)].append((i, r[1] if len(r) > 1 else '?'))
              if bad:
                  for n, items in sorted(bad.items()):
                      print(f'❌ {path}: {len(items)} row(s) with {n} fields, expected {want}')
                      for line_no, name in items[:10]:
                          print(f'     line {line_no}: {name}')
                      if len(items) > 10:
                          print(f'     ... and {len(items) - 10} more')
                  print('   Most likely cause: an unquoted comma inside a quoted-worthy '
                        'field (e.g. Description). Wrap the field in double quotes — '
                        'do NOT delete a trailing column to make the count match.')
                  FAIL = 1
              else:
                  print(f'✓ {path}: all {len(data)} rows have {want} fields')

              # SECOND ARM — and the one that actually bites.
              # A count check alone is NOT sufficient, proven empirically: the seven
              # corrupt rows were trimmed to 13 fields, so they pass the count check
              # while still being shifted. These columns have tight, verified value
              # domains, so a shifted row lands text where a flag belongs and is
              # caught regardless of how many fields the row happens to have.
              DOMAINS = {
                  'Has_Formula':        {'True', 'False'},
                  'User_Modifiable':    {'0', '1'},
                  'Hide_When_No_Value': {'0', '1'},
              }
              idx = {name: header.index(name) for name in DOMAINS if name in header}
              offenders = []
              for i, r in enumerate(data, start=2):
                  for name, col in idx.items():
                      if col < len(r) and r[col] not in DOMAINS[name]:
                          offenders.append((i, r[1] if len(r) > 1 else '?', name, r[col]))
              if offenders:
                  print(f'❌ {path}: {len(offenders)} column(s) outside their value domain '
                        '— almost always a field shift:')
                  for line_no, pname, name, val in offenders[:10]:
                      print(f'     line {line_no}: {pname}: {name} = {val!r}')
                  if len(offenders) > 10:
                      print(f'     ... and {len(offenders) - 10} more')
                  FAIL = 1
              elif idx:
                  print(f'✓ {path}: {", ".join(sorted(idx))} all within their value domains')
          sys.exit(FAIL)
          EOF

      - name: Validate CSV structure (required columns)
        run: |
          python3 - <<'EOF'
          import csv, sys, os

          # Required columns are the ACTUAL column names in each file's real
          # header. The previous values were stale (e.g. 'ScheduleName' vs the
          # real 'Schedule_Name'; 'StingCategory'/'COBieType' which COBIE_TYPE_MAP
          # has never had — it uses the COBie Type-sheet schema TypeCode/TypeName/
          # Category). This check never actually ran on CI because the earlier
          # duplicate-GUID step aborted the job first, so the drift went unseen.
          # Several STING CSVs also start with a `#` comment banner, so skip
          # leading comment/blank lines before reading the header.
          REQUIRED_COLS = {
            'MR_SCHEDULES.csv': {'Schedule_Name', 'Category', 'Discipline'},
            'COBIE_TYPE_MAP.csv': {'TypeCode', 'TypeName', 'Category'},
          }

          def read_header(path):
              with open(path, encoding='utf-8') as f:
                  for row in csv.reader(f):
                      if not row:
                          continue
                      first = (row[0] or '').lstrip('﻿').strip()
                      if first.startswith('#') or first == '':
                          continue   # comment / blank banner line
                      return [c.lstrip('﻿').strip() for c in row]
              return []

          FAIL = 0
          for fname, cols in REQUIRED_COLS.items():
              path = f'StingTools/Data/{fname}'
              if not os.path.exists(path):
                  continue
              try:
                  header = read_header(path)
                  missing = cols - set(header)
                  if missing:
                      print(f'❌ {fname} missing columns: {missing} (header: {header[:8]}…)')
                      FAIL = 1
                  else:
                      print(f'✓ {fname}: required columns present')
              except Exception as e:
                  print(f'❌ {fname}: {e}')
                  FAIL = 1
          if not FAIL:
              print('✓ CSV structure valid')
          sys.exit(FAIL)
          EOF

  # ── 2. Viewer JS syntax gate (Linux, fast) ───────────────────────────────────
  viewer-check:
    name: Viewer JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: Planscape/assets/viewer/package-lock.json

      - name: Install viewer deps
        working-directory: Planscape/assets/viewer
        run: npm ci --no-audit --no-fund

      - name: Syntax check all JS files
        working-directory: Planscape/assets/viewer
        run: npm run check

      - name: Vite build (verify bundle compiles)
        working-directory: Planscape/assets/viewer
        run: npm run build
        continue-on-error: true  # build failures are warnings until CI serves dist/

      - name: Report bundle size
        working-directory: Planscape/assets/viewer
        if: always()
        run: |
          if [ -d dist ]; then
            echo "### Viewer bundle sizes" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            du -sh dist/*.js dist/*.css 2>/dev/null | sort -rh >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            TOTAL=$(du -sh dist/ | cut -f1)
            echo "Total: $TOTAL (target < 200KB)" >> $GITHUB_STEP_SUMMARY
          fi

  # ── 3. Plugin build (Windows, real Revit 2025 reference assemblies from NuGet) ─
  build:
    name: Build StingTools Plugin
    # Windows required — UseWPF=true and UseWindowsForms=true need Windows SDK
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The plugin compiles against the REAL Revit 2025 reference assemblies
      # (Nice3point.Revit.Api.RevitAPI / .RevitAPIUI 2025.x) restored from NuGet —
      # see StingTools.csproj. No local Revit install + no $(RevitApiPath) here, so
      # the csproj's UseRevitNuget path kicks in. The hand-written stubs under
      # tools/revit-stubs/ are RETIRED (no longer built or referenced by CI).

      # ── Step 2: Restore NuGet packages for dependent projects ───────────────
      - name: Restore dependencies (Planscape.Shared)
        run: dotnet restore Planscape.Server/src/Planscape.Shared/Planscape.Shared.csproj
        shell: pwsh

      - name: Restore dependencies (Planscape.PluginSync)
        run: dotnet restore Planscape.Server/src/Planscape.PluginSync/Planscape.PluginSync.csproj
        shell: pwsh

      - name: Restore dependencies (StingTools.Standards)
        run: dotnet restore StingTools.Standards/StingTools.Standards.csproj
        shell: pwsh

      - name: Restore dependencies (StingTools plugin)
        run: dotnet restore StingTools/StingTools.csproj
        shell: pwsh

      # ── Step 3: Build the plugin ────────────────────────────────────────────
      - name: Build StingTools plugin (real Revit reference assemblies)
        run: |
          dotnet build StingTools/StingTools.csproj `
            --configuration Release `
            --no-restore `
            --nologo `
            -v minimal
        shell: pwsh

      # ── Step 4: Deploy to CompiledPlugin/ ───────────────────────────────────
      - name: Package plugin output
        run: |
          $buildOut   = "StingTools\bin\Release"
          $deployDir  = "CompiledPlugin"
          $dataDir    = "$deployDir\data"
          New-Item -ItemType Directory -Force -Path $deployDir | Out-Null
          New-Item -ItemType Directory -Force -Path $dataDir   | Out-Null

          # Main DLL
          Copy-Item "$buildOut\StingTools.dll" $deployDir -Force

          # Dependency DLLs (exclude Revit API stubs — not needed at runtime)
          Get-ChildItem "$buildOut\*.dll" |
            Where-Object { $_.Name -notin @('RevitAPI.dll','RevitAPIUI.dll') } |
            Copy-Item -Destination $deployDir -Force

          # Data files
          if (Test-Path "$buildOut\data") {
            Copy-Item "$buildOut\data\*" $dataDir -Recurse -Force
          } elseif (Test-Path "StingTools\Data") {
            Copy-Item "StingTools\Data\*" $dataDir -Recurse -Force
          }

          # Addin manifest
          Copy-Item "StingTools.addin" $deployDir -Force

          $dllCount  = (Get-ChildItem "$deployDir\*.dll").Count
          $dataCount = (Get-ChildItem $dataDir -Recurse -File).Count
          Write-Host ""
          Write-Host "=== PLUGIN PACKAGED ==="
          Write-Host "Location  : $deployDir"
          Write-Host "DLLs      : $dllCount"
          Write-Host "Data files: $dataCount"
        shell: pwsh

      # ── Step 5: Upload artifact ─────────────────────────────────────────────
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: StingTools-Plugin-${{ github.sha }}
          path: CompiledPlugin/
          retention-days: 14
