# Cloudflare Pages config for Wrangler CLI.
# Used by: wrangler pages deploy ./marketing-site --project-name=planscape-marketing
#
# Pages settings (build command, output dir) live in the Cloudflare dashboard
# under: Pages → planscape-marketing → Settings → Builds & deployments.
# Recommended dashboard settings:
#   Production branch: main
#   Build command:     (empty — static site, no build step)
#   Build output dir:  marketing-site
#   Root directory:    /
#
# This file controls deploy-time options + Function bindings.

name = "planscape-marketing"
pages_build_output_dir = "."
compatibility_date = "2026-05-01"

# Project-wide vars (non-secret)
[vars]
SITE_URL = "https://planscape.build"

# SETTING A SECRET IS NOT ENOUGH — YOU MUST REDEPLOY. Pages Functions capture
# their bindings at DEPLOYMENT time. An existing deployment keeps the bindings it
# was created with, so a newly-added secret does not reach the running Functions
# until the next `npm run deploy`. `wrangler pages secret list` showing the name
# proves it is STORED, not that it is BOUND.
#
# Measured 2026-08-16 (#674): LICENSE_PRIVATE_KEY was set and appeared in
# `secret list`, yet POST /api/license/present kept returning 500 "Licensing is
# not configured". A redeploy of a byte-identical tree — no code change at all —
# flipped it to 400. Diagnostic: an endpoint 500ing on a guard for a secret that
# `secret list` shows means "not deployed since it was set".
#
# Auth core (B1) secrets — DO NOT put real values here. Set them as encrypted
# environment variables / secrets in the Cloudflare dashboard:
#   Pages → planscape-marketing → Settings → Environment variables (Production).
#   JWT_SECRET      Secret. 32+ random bytes. Generate: openssl rand -base64 32
#                   Signs HS256 access tokens. Rotating it invalidates all JWTs.
#   RESEND_API_KEY  Secret. Resend API key (re_...) for verification / reset email.
#   APP_ORIGIN      Plain var. Public origin for email links. https://planscape.build
#   EMAIL_FROM      Plain var (optional). Override the From: address.
#                   Default: "Planscape <noreply@planscape.build>"
# The auth Functions reuse the WAITLIST_DB D1 binding below — no new binding needed.

# Licensing (functions/api/license/*).
#   LICENSE_PRIVATE_KEY  Secret. PKCS#8 PEM of the RSA key whose PUBLIC half is
#                        compiled into the plugin at
#                        StingTools/Core/Licensing/LicensePublicKey.cs.
#                        issue.ts signs with it; present.ts re-signs to verify
#                        (see _lib/crypto.ts for why there is no public-key
#                        binding). Set from the issuer's key:
#                          wrangler pages secret put LICENSE_PRIVATE_KEY \
#                            --project-name planscape-marketing \
#                            < StingTools.LicenseIssuer/private.pem
#                        THEN REDEPLOY. Production only — preview shares this
#                        project's D1 (#652), so a preview binding would let a
#                        preview branch mint real licences.
#                        Uploading a MISMATCHED key is the dangerous failure:
#                        issuing and presentation both succeed, and only the
#                        plugin rejects the licence, offline, at the customer.
#                        Verify the pair before setting:
#                          openssl rsa -in private.pem -pubout
#                        must equal the PEM in LicensePublicKey.cs.

# Cloud handoff (functions/api/cloud/handoff.ts) — where "sign in" hands a
# logged-in planscape.build user off to the coordinator app.
#   CLOUD_APP_ORIGIN  Plain var, not actually secret (just a URL) — set as a
#                     Pages secret only because this project deploys via
#                     `wrangler pages deploy`, not git, so wrangler.toml [vars]
#                     changes never reach it without a manual redeploy.
#                     Falls back to https://app.planscape.build if unset.
#                     CURRENT VALUE (set 2026-07-31): https://app.planscape.build
#                     — verified as a Render custom domain on planscape-web-free
#                     and confirmed serving over HTTPS the same day. Briefly
#                     pointed at the bare Render URL as an interim value while
#                     the custom domain was being verified; no longer needed.
#                     To change it later:
#                       echo "<new origin>" | \
#                         wrangler pages secret put CLOUD_APP_ORIGIN \
#                         --project-name planscape-marketing
#                     A REDEPLOY IS REQUIRED — see the note above the secrets
#                     list. This line previously claimed the opposite.

# Contact form (functions/api/contact.ts) — reuses the WAITLIST_DB binding below.
#   CONTACT_TO  Plain var, optional. Where contact-form notifications go.
#               Defaults to hello@planscape.build, the address contact.html
#               already offers as its fallback. Sending reuses RESEND_API_KEY.
#               If that is unset the submission is STILL STORED and
#               `contacts.notified_at` stays NULL — the queryable record of
#               "someone wrote in and no email went out":
#                 SELECT * FROM contacts WHERE notified_at IS NULL;
#               Setting it requires a redeploy (see #674), like every var here.

# D1 binding, shared by every Function (waitlist, auth, billing, licence, contact).
# Created via: wrangler d1 create planscape-waitlist
#
# THIS IS THE PRODUCTION DATABASE. Which binding a deployment actually gets:
#
#   wrangler pages deploy --branch=main   -> [env.production] (same DB as here)
#   wrangler pages deploy --branch=other  -> [env.preview]    (the SEPARATE DB)
#   wrangler pages dev                    -> local SQLite, via the --d1 flag in
#                                            the `dev` script; never touches either
#
# The three blocks used to name the same database_id, which is how a preview
# deployment could write live licence data (#652). If you add a binding, add it to
# all three and make preview's point somewhere disposable.
[[d1_databases]]
binding       = "WAITLIST_DB"
database_name = "planscape-waitlist"
database_id   = "b7029da2-6019-4ceb-bd87-22870a313db7"

# R2 binding for the gated download area (functions/api/downloads/*).
# Created via: wrangler r2 bucket create planscape-downloads
# The bucket is PRIVATE — files are streamed through a Function that checks the
# caller's subscription entitlement first, so a download link cannot be forwarded
# to someone who has not paid. Never make this bucket public.
# Upload a build:
#   wrangler r2 object put planscape-downloads/<tool>/<version>/<file>.zip --file <path>
[[r2_buckets]]
binding     = "DOWNLOADS"
bucket_name = "planscape-downloads"

# Per-environment overrides
[env.preview]
name = "planscape-marketing-preview"

[env.preview.vars]
SITE_URL = "https://preview.planscape.build"

# SEPARATE DATABASE — do not point this back at planscape-waitlist (#652).
#
# All three environments used to share one D1, so a preview deployment read and
# wrote LIVE licence data: it could issue real licences against a real tenant's
# cap, revoke them, and stamp last_seen_at, none of it distinguishable afterwards
# from legitimate activity because it landed in the rows the production path
# writes. The blast radius grew when #621 made `licenses` the seat-entitlement
# source of truth — the table stopped being a waitlist and started deciding what
# customers can do and what they are billed for.
#
# Created 2026-08-17 and seeded from functions/api/schema.sql. It is empty by
# design; preview exercises the real code against disposable data.
#
# After changing schema.sql, apply it here too or preview breaks in ways
# production does not:
#   npx wrangler d1 execute planscape-waitlist-preview --remote --file=./functions/api/schema.sql
[[env.preview.d1_databases]]
binding       = "WAITLIST_DB"
database_name = "planscape-waitlist-preview"
database_id   = "75855f69-2950-4378-b591-18e33af3e5bf"

[[env.preview.r2_buckets]]
binding     = "DOWNLOADS"
bucket_name = "planscape-downloads"

[env.production]
name = "planscape-marketing"

[env.production.vars]
SITE_URL = "https://planscape.build"

[[env.production.d1_databases]]
binding       = "WAITLIST_DB"
database_name = "planscape-waitlist"
database_id   = "b7029da2-6019-4ceb-bd87-22870a313db7"

[[env.production.r2_buckets]]
binding     = "DOWNLOADS"
bucket_name = "planscape-downloads"
