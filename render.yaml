# render.yaml — Render.com Blueprint (Infrastructure-as-Code) for Planscape.
#
# ⚠ THIS FILE DOES NOT GOVERN THE LIVE SERVICES. Verified 2026-08-17 (#717).
#
# The services actually running were created outside this blueprint and carry
# different names, so EDITING THIS FILE CHANGES NOTHING IN PRODUCTION:
#
#   declared here          reality
#   planscape-api    web   -> planscape-api.onrender.com  404 (no such service)
#                             the live API is planscape-api-free.onrender.com (200)
#   planscape-web    web   -> planscape-web.onrender.com   404 (no such service)
#                             yet app.planscape.build serves 200, so it exists
#                             under some other name
#   planscape-worker       -> private service, no public hostname: untestable
#   planscape-converter    -> private service, no public hostname: untestable
#
# Re-check any time, no credentials needed:
#   curl -s -o /dev/null -w "%{http_code}\n" https://planscape-api.onrender.com/
#   curl -s -o /dev/null -w "%{http_code}\n" https://planscape-api-free.onrender.com/
#
# CONSEQUENCES, both of which have already cost time:
#
#   * autoDeploy: true below is NOT why the live estate rebuilds on every push.
#     That is the dashboard's own Auto-Deploy setting on the real services.
#     Setting autoDeploy: false here fixes nothing (#717).
#   * The custom domain api.planscape.build was never attached, and it is
#     NXDOMAIN today (#705). The CNAME target in DEPLOY_RUNBOOK.md names
#     planscape-api, which does not exist.
#
# Treat this file as the INTENDED shape, useful if the blueprint is ever applied
# for real. Until then, production settings live in the Render dashboard, and
# changes have to be made there. Same failure family as #651 (merging deploys
# nothing) and #674 (a stored secret is not a bound secret): what the repo says
# is not what is serving.
#
# MUST live at the REPOSITORY ROOT — Render only auto-detects a blueprint here,
# and the Docker build context (and the Dockerfile's COPY paths) are relative to
# the repo root. The API Dockerfile copies both Planscape/assets/viewer/** and
# Planscape.Server/src/** from the monorepo root, so its dockerContext is "."
# (root) and dockerfilePath points into the subfolder.
#
# WHAT THIS PROVISIONS (see docs/DEPLOY_RUNBOOK.md for the step-by-step):
#   - planscape-api        web      ASP.NET Core 8 API (also serves the demo
#                                   dashboard + coordination viewer + viewer.html)
#   - planscape-worker     worker   same image, PLANSCAPE_ROLE=worker — runs the
#                                   "heavy" Hangfire queue (IFC→GLB convert,
#                                   photo redaction, DB backup, derivatives)
#   - planscape-web        web      Next.js browser app (planscape-web/)
#   - planscape-converter  pserv    IFC→GLB converter sidecar (private/internal)
#   - planscape-redis      keyvalue JWT revocation + rate-limit + SignalR backplane
#   - planscape-minio      pserv    S3-compatible object storage on a disk
#                                   (models, photos, documents, IFC→GLB, scene-nodes)
#   - planscape-db         postgres PostgreSQL 16 (managed)
#
# EXTERNAL (not Render-provisionable — set in the env group, see runbook):
#   - LiveKit Cloud for meeting video (LiveKit__*). Self-hosting the media
#     server is NOT viable on Render itself (no UDP support, confirmed against
#     Render's own open feature request + community threads — see
#     docs/LIVEKIT_AND_CORPORATE_UI_FINDINGS.md §1c); a VPS is the only
#     self-host path, and isn't needed while LiveKit Cloud's free/paid tiers
#     cover both firms.
#   - Firebase project for push (Firebase__*)
#   - Resend (or SMTP) for transactional email (Email__* / Resend__*)
#   - Autodesk APS app for server-side ACC (Acc__*)
#
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # ── Planscape API (ASP.NET Core 8) ──────────────────────────────────────────
  - type: web
    name: planscape-api
    runtime: docker
    dockerfilePath: ./Planscape.Server/docker/Dockerfile
    dockerContext: .            # repo root — the Dockerfile COPYs from Planscape/ and Planscape.Server/
    branch: main
    region: frankfurt           # eu-central-1 — closest to UK/Europe clients
    # $7/mo, 512 MB / 0.5 CPU. Holds ~20-30 connected and 10-15 ACTIVELY
    # coordinating users. Go to standard ($25, 2 GB / 1 CPU) at ~30 active,
    # or when CPU is >70% sustained. Autoscaling is Pro-gated ($85), so
    # below Pro this is a single box and every deploy drops all WebSockets.
    # Full tier capacity table: docs/DEPLOY_RUNBOOK.md § Cost / scaling notes.
    plan: starter
    # /health/live, NOT /health.
    #
    # /health is the full diagnostic (which database, which push provider, a
    # Redis ping) and the S11 hardening gates it on
    #   Development ? isPrivate : isPrivate && tokenOk
    # In Production that means a private-network caller AND a matching
    # X-Health-Token header. Render's health prober cannot send that header, so
    # /health would answer 403, Render would mark the service unhealthy, and the
    # deploy would never go live — on a healthy app.
    #
    # /health/live is AllowAnonymous by design and returns {status:"alive"}.
    # It is the liveness contract; /health/ready adds a DB CanConnect check if
    # you would rather gate on dependencies too.
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      # Schema management: the EF migration set is incomplete by design
      # (Program.cs:1318-1380 — EnsureCreated + idempotent patchers is the
      # official mechanism). Without this flag a FRESH database takes the
      # Migrate() branch and comes up nearly empty.
      - key: PLANSCAPE_USE_ENSURE_CREATED
        value: "true"
      # Cloud handoff shared secret — MUST equal the value set on the
      # planscape.build Cloudflare Pages project. See
      # docs/PLANSCAPE_IDENTITY_HANDOFF.md.
      - key: PLANSCAPE_HANDOFF_SECRET
        sync: false
      # Database — injected automatically from planscape-db below.
      # This is the DIRECT (port 5432) connection. Hangfire (advisory locks +
      # LISTEN/NOTIFY) and the nightly pg_dump always use this one.
      - key: ConnectionStrings__Default
        fromDatabase:
          name: planscape-db
          property: connectionString
      # OPTIONAL — PgBouncer (port 6432). Render ships connection pooling free
      # on paid databases but it is OFF by default, and `connectionPoolString`
      # only resolves once you enable it, so this stays commented out until
      # you do. To turn it on:
      #   1. Render → planscape-db → Settings → enable Connection Pooling
      #   2. Uncomment the three lines below (and the matching pair on
      #      planscape-worker), then redeploy.
      # The app reads ConnectionStrings:Pooled for EF queries only, and
      # ignores it entirely when Database:RlsEnabled=true — session-scoped
      # SET app.current_tenant leaks across tenants under transaction
      # pooling. See Program.cs "Connection budget".
      # - key: ConnectionStrings__Pooled
      #   fromDatabase:
      #     name: planscape-db
      #     property: connectionPoolString
      # Redis — auto-wired from the planscape-redis Key Value instance below.
      - key: Redis__Connection
        fromService:
          type: keyvalue
          name: planscape-redis
          property: connectionString
      # Converter sidecar internal URL. Set after first deploy: Render →
      # planscape-converter → Connect → Internal URL (e.g. http://planscape-converter:7700).
      # Left sync:false so an unset value cleanly disables IFC→GLB (no behaviour change).
      - key: Converter__BaseUrl
        sync: false
      # Everything else (secrets + shared config) comes from the group below.
      - fromGroup: planscape-shared

  # ── Planscape Worker (same image, heavy Hangfire queue) ─────────────────────
  # PLANSCAPE_ROLE=worker makes the process subscribe to the worker-only queues
  # ("photo-redaction", "heavy", …). Without this service those jobs NEVER run:
  # IFC→GLB conversion, photo blur/watermark redaction, nightly DB backup, model
  # derivatives. See Program.cs (Phase 178 worker/API split).
  - type: worker
    name: planscape-worker
    runtime: docker
    dockerfilePath: ./Planscape.Server/docker/Dockerfile
    dockerContext: .
    branch: main
    region: frankfurt
    plan: starter
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080          # Kestrel still binds; the worker just isn't HTTP-routed
      - key: PLANSCAPE_ROLE
        value: worker
      # REQUIRED on the worker too — the schema block in Program.cs (~line 1341)
      # is NOT gated by `isWorker`, so both roles run it. Without this flag the
      # worker (ASPNETCORE_ENVIRONMENT=Production ⇒ IsDevelopment() false) takes
      # the db.Database.Migrate() branch, collides with the API's EnsureCreated
      # schema on the non-idempotent 20260626203153_SustainabilitySnapshots
      # CreateTable, and crash-loops. Keep in lockstep with planscape-api.
      - key: PLANSCAPE_USE_ENSURE_CREATED
        value: "true"
      # Same shared secret as the API — the worker resolves handoff-provisioned
      # identities in background jobs. See docs/PLANSCAPE_IDENTITY_HANDOFF.md.
      - key: PLANSCAPE_HANDOFF_SECRET
        sync: false
      - key: ConnectionStrings__Default
        fromDatabase:
          name: planscape-db
          property: connectionString
      # Uncomment together with the API's ConnectionStrings__Pooled block
      # after enabling Connection Pooling on planscape-db.
      # - key: ConnectionStrings__Pooled
      #   fromDatabase:
      #     name: planscape-db
      #     property: connectionPoolString
      - key: Redis__Connection
        fromService:
          type: keyvalue
          name: planscape-redis
          property: connectionString
      - key: Converter__BaseUrl
        sync: false
      - fromGroup: planscape-shared

  # ── Planscape Web (Next.js 14 browser app) ──────────────────────────────────
  - type: web
    name: planscape-web
    runtime: node
    rootDir: planscape-web
    branch: main
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build   # no lockfile committed → install, not ci
    startCommand: npm start                       # next start, binds $PORT (Render sets it)
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Baked into the client bundle at build time. Must match the API origin.
      - key: NEXT_PUBLIC_API_BASE
        value: https://api.planscape.build
    # After first deploy add the custom domain app.planscape.build (Settings →
    # Custom Domains) + CNAME at the registrar. It's already in the API CORS list.

  # ── IFC→GLB converter sidecar (private service) ─────────────────────────────
  # Internal-only (pserv) — reached by the API/worker over Render's private
  # network, never exposed publicly. Builds from the sidecar Dockerfile; the
  # IFCCONVERT_URL env is passed through as a Docker build-arg (Render exposes
  # service env vars to the build). Install is non-fatal: a bad URL leaves GLB
  # chunking working and /ifc-to-glb returning 501.
  - type: pserv
    name: planscape-converter
    runtime: docker
    dockerfilePath: ./Planscape.Server/src/converter-sidecar/Dockerfile
    dockerContext: ./Planscape.Server/src/converter-sidecar
    branch: main
    region: frankfurt
    plan: starter
    # NB: pserv (private service) types cannot carry healthCheckPath — the
    # Blueprint validator rejects it. The sidecar still exposes /health for
    # the API's own liveness probing over the private network.
    autoDeploy: true
    envVars:
      - key: PORT
        value: "7700"
      # MUST equal the API's Converter__Token (in the planscape-shared group).
      - key: CONVERTER_TOKEN
        sync: false
      # Current linux64 IfcConvert zip — verify at deploy (ifcopenshell-builds
      # uses content-hashed filenames that drift per release).
      - key: IFCCONVERT_URL
        value: https://s3.amazonaws.com/ifcopenshell-builds/IfcConvert-v0.8.0-linux64.zip
      # Only used by the separate /chunk path. Paste planscape-api internal URL.
      - key: API_BASE
        sync: false
      - key: API_BEARER
        sync: false

  # ── Redis / Key Value (JWT revocation, rate limit, SignalR backplane) ───────
  - type: keyvalue
    name: planscape-redis
    region: frankfurt
    plan: starter
    # Cache-style eviction: rate-limit + revocation entries are reconstructable
    # and the app fails open, so LRU is safe and avoids OOM. Switch to
    # noeviction if you later treat the revocation list as authoritative.
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []             # empty = internal connections only (no public access)

  # ── MinIO — S3-compatible object storage (provisioned by this Blueprint) ────
  # Render can't give managed S3, so we run single-node MinIO on a persistent
  # disk as a private service. The API auto-creates the bucket on startup
  # (S3FileStorageService.EnsureBucketAsync). Good for launch; for redundancy/
  # scale switch Storage__S3__* to Cloudflare R2 or AWS S3 and drop this service.
  # NOTE: single disk ⇒ single instance, no HA — back the disk up or migrate to
  # R2/S3 before serious data volume.
  - type: pserv
    name: planscape-minio
    runtime: image
    image:
      url: docker.io/minio/minio:latest
    dockerCommand: server /data --console-address ":9001"
    region: frankfurt
    plan: starter
    # (no healthCheckPath — pserv types cannot carry one; MinIO liveness is
    # still available to peers at /minio/health/live on port 9000)
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 10                # ~$0.25/GB/mo; grow as model/photo volume grows
    envVars:
      - key: MINIO_ROOT_USER
        sync: false             # = Storage__S3__AccessKey in the group below
      - key: MINIO_ROOT_PASSWORD
        sync: false             # = Storage__S3__SecretKey in the group below

# ── Shared env group — referenced by planscape-api AND planscape-worker ──────
# (Groups can't hold fromDatabase/fromService refs, so the DB + Redis + Converter
# URL wiring stays inline on each service above; everything else lives here once.)
envVarGroups:
  - name: planscape-shared
    envVars:
      # ── JWT (secret) ──
      - key: Jwt__Key
        sync: false             # 32+ random bytes: openssl rand -base64 48
      - key: Jwt__Issuer
        value: Planscape
      - key: Jwt__Audience
        value: Planscape.Client

      # ── Platform owner bootstrap (PlatformOwnerSeeder, idempotent) ──
      - key: PLANSCAPE_OWNER_EMAIL
        value: davis@planscape.build
      - key: PLANSCAPE_OWNER_PASSWORD
        sync: false             # required to make the owner loginable on first boot

      # ── Storage — object store. Defaults target the provisioned planscape-minio
      # service above; switch ServiceUrl/keys to Cloudflare R2 or AWS S3 for a
      # managed/redundant store (then ForcePathStyle=false + the right Region). ──
      - key: Storage__Provider
        value: S3
      - key: Storage__S3__BucketName
        value: planscape          # auto-created on first boot
      - key: Storage__S3__Region
        value: us-east-1          # MinIO default region; for AWS use e.g. eu-west-2
      - key: Storage__S3__ServiceUrl
        sync: false               # planscape-minio internal URL, e.g. http://planscape-minio:9000 (blank for AWS S3)
      - key: Storage__S3__AccessKey
        sync: false               # = MINIO_ROOT_USER (or R2/S3 access key)
      - key: Storage__S3__SecretKey
        sync: false               # = MINIO_ROOT_PASSWORD (or R2/S3 secret key)
      - key: Storage__S3__ForcePathStyle
        value: "true"             # true for MinIO/R2; "false" for AWS S3

      # ── LiveKit — meeting video/WebRTC (LiveKit Cloud free tier or self-host) ──
      - key: LiveKit__ApiKey
        sync: false
      - key: LiveKit__ApiSecret
        sync: false
      - key: LiveKit__ServerUrl
        sync: false             # wss://<your>.livekit.cloud
      - key: LiveKit__Url
        sync: false             # alias read in some call sites; set to the same wss URL

      # ── Firebase — push notifications (FCM) ──
      - key: Firebase__ProjectId
        sync: false
      - key: Firebase__ServiceAccountJson
        sync: false             # paste the service-account JSON (single line)

      # ── Email — invites / password reset / owner reset. Without it, mail is
      # only logged. Resend (HTTP) is easiest; verify planscape.build as sender. ──
      - key: Email__Provider
        sync: false             # "resend" (recommended) or "smtp"
      - key: Resend__ApiKey
        sync: false             # required when Email__Provider=resend
      - key: Smtp__Host
        sync: false             # required when Email__Provider=smtp
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false

      # ── ACC (Autodesk Construction Cloud) — optional server-side connector ──
      - key: Acc__ClientId
        sync: false
      - key: Acc__ClientSecret
        sync: false
      - key: Acc__CallbackUrl
        value: https://api.planscape.build/api/acc/oauth/callback

      # ── Converter shared token — MUST equal planscape-converter's CONVERTER_TOKEN ──
      - key: Converter__Token
        sync: false

      # ── CORS — web origins allowed to call the API ──
      - key: Cors__Origins__0
        value: https://planscape.build
      - key: Cors__Origins__1
        value: https://app.planscape.build

      # ── Where the BROWSER app lives ──
      # Read by WebAppUrl.Resolve. The accept-invite page (served by this API)
      # must send a freshly-activated invitee to the product, which is a
      # different origin — without this it can only infer the pairing from the
      # API hostname, and infers nothing at all behind a tunnel or custom host.
      - key: Planscape__WebAppUrl
        value: https://app.planscape.build

      # ── Serilog ──
      - key: Serilog__MinimumLevel__Default
        value: Warning

databases:
  # ── PostgreSQL 16 (managed by Render) ──────────────────────────────────────
  - name: planscape-db
    databaseName: planscape
    user: planscape
    region: frankfurt
    # Render retired the legacy Postgres plan names (starter/standard/pro) —
    # new databases must use the current instance types. basic-256mb is the
    # ~$6/mo entry tier; move to basic-1gb once you have paying firms.
    #
    # CONNECTION CEILING, not storage, is what bites first: every basic tier
    # (and pro-4gb) allows 100 connections, ~97 usable. 200 only at pro-8gb,
    # 400 at pro-16gb. Program.cs budgets the pools against 97 — raise
    # Database__MaxPoolSize and this plan together, never one alone.
    plan: basic-256mb

# ── Indicative cost (Frankfurt, all-starter) ────────────────────────────────
# Render bills in USD. api $7 + worker $7 + web $7 + converter $7 + redis $10
# + minio $7 + 10GB disk ~$2.50 + db $6 ≈ $54/mo. External: LiveKit Cloud
# (free tier), Firebase (free), Resend (free tier).
#
# NB: any "£12/month" figure you find in older notes refers to the retired
# 2-service blueprint (api + db only), not this 7-service one.
#
# Drop planscape-worker + planscape-converter to save ~$14 if you don't need
# IFC conversion / photo redaction yet (the API degrades gracefully). Swap
# planscape-minio for Cloudflare R2 (free tier) to remove the storage service
# + disk (~$9.50) and gain redundancy. Redis is optional (the app fails open)
# but required once you run more than one API instance — it's the SignalR
# backplane.
#
# ── Capacity per API tier ───────────────────────────────────────────────────
# "Connected" = logged in with a WebSocket open, light use. "Active" = driving
# issues / markup / CRDT. Derived from: ~40 req/s per vCPU on this app's
# .Include()-heavy list endpoints, ~10 req/min per active coordinator, minus
# the Hangfire background floor (ClamAvScannerJob is Cron.Minutely).
#
#   Free      $0    — 0 firms. Spins down after 15 min (kills every WS), no
#                     persistent disk so MinIO can't run. Demo only.
#   Starter   $7    — 3-6 small firms.  ~20-30 connected /  10-15 active
#   Standard  $25   — 10-20 firms.      ~60-100 connected /  30-50 active
#   Pro       $85   — 30-60 firms.     ~150-250 connected /  80-120 active
#                     First tier with autoscaling; scale OUT from here.
#   Pro Plus  $175  — 60-120 firms.    ~300-500 connected / 150-250 active
#   Pro Max   $225  — skip. 16 GB but still 4 CPU, so worse $/CPU than Pro
#                     Plus for a CPU-bound app.
#   Pro Ultra $450  — prefer 3-4 x Pro instead: cheaper, no single point of
#                     failure, and the Redis backplane already supports it.
#
# Bandwidth can exceed compute: a 500 MB IFC/GLB x 20 coordinators/day is
# ~300 GB/mo ≈ $45 at $0.15/GB overage. Serve models by presigned URL from
# object storage, never proxied through the API.
